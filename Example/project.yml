name: AgentExample
options:
  bundleIdPrefix: com.makemore.agentfrontend
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  AgentFrontend:
    path: ".."

targets:
  AgentExample:
    type: application
    platform: iOS
    sources:
      - path: ExampleApp
    info:
      path: ExampleApp/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities: [armv7]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: "Used to transcribe what you say so the agent can reply."
        NSSpeechRecognitionUsageDescription: "Used on-device to turn your voice into text for the agent."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.makemore.agentfrontend.example
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: AgentFrontend
        product: AgentFrontend
      - package: AgentFrontend
        product: AgentClient

  AgentExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ExampleAppUITests
    info:
      path: ExampleAppUITests/Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.makemore.agentfrontend.example.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TEST_TARGET_NAME: AgentExample
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: AgentExample

schemes:
  # Default scheme — no env overrides. Launcher uses its built-in
  # fallbacks (stub at 127.0.0.1:8765, Django at 127.0.0.1:8000) and
  # the XCUITest target reads BACKEND_URL / AGENT_TOKEN from the shell.
  AgentExample:
    build:
      targets:
        AgentExample: all
        AgentExampleUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentExampleUITests
      # Environment variables forwarded to the XCUITest runner. Values
      # use ${VAR} substitution against the shell that runs `xcodegen
      # generate`, so the real-backend test reads the live BACKEND_URL
      # and AGENT_TOKEN from the developer's terminal.
      environmentVariables:
        - variable: BACKEND_URL
          value: ${BACKEND_URL}
          isEnabled: true
        - variable: AGENT_TOKEN
          value: ${AGENT_TOKEN}
          isEnabled: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Local Django dev server (`manage.py runserver`) on the host machine.
  # Pick this from the Xcode toolbar to launch the app pointing at
  # http://127.0.0.1:8000 with no further setup.
  Local (runserver):
    build:
      targets:
        AgentExample: all
    run:
      config: Debug
      environmentVariables:
        - variable: BACKEND_URL
          value: http://127.0.0.1:8000
          isEnabled: true
        - variable: AGENT_KEY
          value: chisel
          isEnabled: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Local Django via ngrok tunnel — required for testing on a real
  # device or from anywhere off the host network. Update the URL here
  # if your tunnel hostname changes.
  Local (ngrok):
    build:
      targets:
        AgentExample: all
    run:
      config: Debug
      environmentVariables:
        - variable: BACKEND_URL
          value: https://terminal.ngrok.app
          isEnabled: true
        - variable: AGENT_KEY
          value: chisel
          isEnabled: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
