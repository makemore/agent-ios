name: AgentExample
options:
  bundleIdPrefix: com.makemore.agentfrontend
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  AgentFrontend:
    path: ".."

targets:
  AgentExample:
    type: application
    platform: iOS
    sources:
      - path: ExampleApp
    info:
      path: ExampleApp/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities: [armv7]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.makemore.agentfrontend.example
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: AgentFrontend
        product: AgentFrontend

  AgentExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ExampleAppUITests
    info:
      path: ExampleAppUITests/Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.makemore.agentfrontend.example.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TEST_TARGET_NAME: AgentExample
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: AgentExample

schemes:
  AgentExample:
    build:
      targets:
        AgentExample: all
        AgentExampleUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgentExampleUITests
      # Environment variables forwarded to the XCUITest runner. Values
      # use ${VAR} substitution against the shell that runs `xcodegen
      # generate`, so the real-backend test reads the live BACKEND_URL
      # and AGENT_TOKEN from the developer's terminal.
      environmentVariables:
        - variable: BACKEND_URL
          value: ${BACKEND_URL}
          isEnabled: true
        - variable: AGENT_TOKEN
          value: ${AGENT_TOKEN}
          isEnabled: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
